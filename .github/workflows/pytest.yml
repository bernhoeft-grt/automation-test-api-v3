name: Pytest Tests + Allure

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'   # Seg-sex as 09:00 BRT (12:00 UTC)
    - cron: '0 18 * * 1-5'   # Seg-sex as 15:00 BRT (18:00 UTC)

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          echo "[1/9] pip install"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright

      - name: Install Playwright browsers
        run: |
          echo "[2/9] Playwright install"
          python -m playwright install chromium || python -m playwright install

      - name: Install system tools
        run: |
          echo "[3/9] apt-get update"
          sudo apt-get update -qq

          echo "[4/9] apt-get install tools"
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            unzip \
            zip \
            default-jre \
            git \
            jq

      - name: Install Allure CLI
        run: |
          echo "[5/9] Allure CLI"
          npm i -g allure-commandline
          allure --version

      - name: Clean directories
        run: |
          echo "[6/9] Limpando diretorios"
          rm -rf reports allure-results allure-report test-results
          mkdir -p reports allure-results

      - name: Debug environment
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}
          AUTH_ENDPOINT: ${{ secrets.AUTH_ENDPOINT }}
          AUTH_TENANT_ID: ${{ secrets.AUTH_TENANT_ID }}
          AUTH_EMAIL: ${{ secrets.AUTH_EMAIL }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          AUTH_MFA: ${{ secrets.AUTH_MFA }}
        run: |
          echo "[7/9] Estrutura de testes:"
          find tests -name "test_*.py" 2>/dev/null | wc -l

          echo "[8/9] Variaveis de ambiente:"
          if [ -n "$BASE_URL" ]; then
            echo "BASE_URL configurada"
          else
            echo "BASE_URL nao configurada"
          fi

          if [ -n "${API_KEY:-}" ]; then
            echo "Autenticacao: API_KEY"
          elif [ -n "${AUTH_EMAIL:-}" ] && [ -n "${AUTH_PASSWORD:-}" ] && [ -n "${AUTH_TENANT_ID:-}" ]; then
            echo "Autenticacao: AUTH_* (login)"
          else
            echo "Autenticacao: NAO CONFIGURADA"
          fi

      - name: Run pytest tests
        id: pytest_tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}
          AUTH_ENDPOINT: ${{ secrets.AUTH_ENDPOINT }}
          AUTH_TENANT_ID: ${{ secrets.AUTH_TENANT_ID }}
          AUTH_EMAIL: ${{ secrets.AUTH_EMAIL }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          AUTH_MFA: ${{ secrets.AUTH_MFA }}
        run: |
          echo "[9/9] Executando testes..."

          set +e
          python -m pytest tests/ -v --alluredir=allure-results --html=reports/report.html --self-contained-html --cov=tests --cov-report=json:coverage.json 2>&1 | tee test.log
          TEST_EXIT_CODE=$?
          set -e

          echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"
          echo "$TEST_EXIT_CODE" > test_exit_code.txt

          echo "Exit code: $TEST_EXIT_CODE"

      - name: Generate Allure report
        if: always()
        run: |
          set +e

          echo "[INFO] Gerando relatorios..."

          if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "[INFO] Gerando relatorio Allure..."
            allure generate allure-results -o allure-report --clean

            if [ $? -eq 0 ]; then
              echo "[OK] Allure gerado"
            fi
          fi

      - name: Zip reports
        if: always()
        run: |
          ZIP_NAME="allure-report_${{ github.run_number }}.zip"
          HTML_ZIP_NAME="pytest-report_${{ github.run_number }}.zip"

          if [ -d "allure-report" ] && [ "$(ls -A allure-report 2>/dev/null)" ]; then
            zip -r "$ZIP_NAME" allure-report >/dev/null 2>&1
          fi

          if [ -d "reports" ] && [ "$(ls -A reports 2>/dev/null)" ]; then
            zip -r "$HTML_ZIP_NAME" reports >/dev/null 2>&1
          fi

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report
            allure-report_*.zip
          retention-days: 15

      - name: Upload Pytest report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            reports
            pytest-report_*.zip
            test_exit_code.txt
            test.log
          retention-days: 15

      - name: Publish Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          destination_dir: allure
          keep_files: true

      - name: Extract Allure statistics
        if: always()
        run: |
          TOTAL_TESTS=0
          PASSED_TESTS=0
          FAILED_TESTS=0
          BROKEN_TESTS=0
          SKIPPED_TESTS=0

          if [ -f "allure-report/widgets/summary.json" ]; then
            TOTAL_TESTS=$(jq -r '.statistic.total // 0' allure-report/widgets/summary.json)
            PASSED_TESTS=$(jq -r '.statistic.passed // 0' allure-report/widgets/summary.json)
            FAILED_TESTS=$(jq -r '.statistic.failed // 0' allure-report/widgets/summary.json)
            BROKEN_TESTS=$(jq -r '.statistic.broken // 0' allure-report/widgets/summary.json)
            SKIPPED_TESTS=$(jq -r '.statistic.skipped // 0' allure-report/widgets/summary.json)
          fi

          echo "TOTAL_TESTS=$TOTAL_TESTS" >> "$GITHUB_ENV"
          echo "PASSED_TESTS=$PASSED_TESTS" >> "$GITHUB_ENV"
          echo "FAILED_TESTS=$FAILED_TESTS" >> "$GITHUB_ENV"
          echo "BROKEN_TESTS=$BROKEN_TESTS" >> "$GITHUB_ENV"
          echo "SKIPPED_TESTS=$SKIPPED_TESTS" >> "$GITHUB_ENV"

          COVERAGE_PCT="N/A"
          if [ -f "coverage.json" ]; then
            RAW=$(jq -r '.totals.percent_covered // empty' coverage.json 2>/dev/null)
            if [ -n "$RAW" ]; then
              COVERAGE_PCT=$(printf "%.0f%%" "$RAW")
            fi
          fi
          echo "COVERAGE_PCT=$COVERAGE_PCT" >> "$GITHUB_ENV"

      - name: Send Teams notification
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "[WARN] TEAMS_WEBHOOK_URL nao configurada. Pulando notificacao Teams."
            exit 0
          fi

          TEST_EXIT_CODE=$(cat test_exit_code.txt 2>/dev/null || echo 1)

          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="SUCESSO"
            THEME_COLOR="00b050"
          elif [ "$TEST_EXIT_CODE" -eq 5 ]; then
            STATUS_EMOJI="⚠️"
            STATUS_TEXT="SEM TESTES"
            THEME_COLOR="ffa500"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="FALHA"
            THEME_COLOR="d13438"
          fi

          case "${{ github.event_name }}" in
            schedule)         GATILHO="Agendado (Regressivo)" ;;
            push)             GATILHO="Push" ;;
            pull_request)     GATILHO="Pull Request" ;;
            workflow_dispatch) GATILHO="Manual" ;;
            *)                GATILHO="${{ github.event_name }}" ;;
          esac

          BRANCH="${{ github.ref_name }}"
          if [ ${#BRANCH} -gt 35 ]; then
            BRANCH="${BRANCH:0:35}..."
          fi

          BUILD_DATE=$(date -u "+%d/%m/%Y %H:%M UTC")

          ALLURE_FAILURES=$((FAILED_TESTS + BROKEN_TESTS))

          if [ "${TOTAL_TESTS:-0}" -gt 0 ]; then
            SUCCESS_RATE=$(( PASSED_TESTS * 100 / TOTAL_TESTS ))
          else
            SUCCESS_RATE=0
          fi

          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/"
          BUILD_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          SUBTITLE="Contract Web V3  |  ${PASSED_TESTS}/${TOTAL_TESTS} testes  |  ${SUCCESS_RATE}% de sucesso"

          jq -n \
            --arg status_emoji  "$STATUS_EMOJI" \
            --arg status_text   "$STATUS_TEXT" \
            --arg run_number    "${{ github.run_number }}" \
            --arg subtitle      "$SUBTITLE" \
            --arg theme_color   "$THEME_COLOR" \
            --arg branch        "$BRANCH" \
            --arg gatilho       "$GATILHO" \
            --arg build_date    "$BUILD_DATE" \
            --arg passed        "$PASSED_TESTS" \
            --arg failed        "$ALLURE_FAILURES" \
            --arg skipped       "$SKIPPED_TESTS" \
            --arg total         "$TOTAL_TESTS" \
            --arg coverage      "$COVERAGE_PCT" \
            --arg success_rate  "${SUCCESS_RATE}%" \
            --arg pages_url     "$PAGES_URL" \
            --arg build_url     "$BUILD_URL" \
            '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": $theme_color,
              "summary": ($status_emoji + " " + $status_text + " — Build #" + $run_number),
              "sections": [
                {
                  "activityTitle": ($status_emoji + " **" + $status_text + " — Build #" + $run_number + "**"),
                  "activitySubtitle": $subtitle,
                  "facts": [
                    {"name": "🌿 Branch",          "value": $branch},
                    {"name": "⚡ Gatilho",          "value": $gatilho},
                    {"name": "📅 Data",             "value": $build_date},
                    {"name": "✅ Passou",            "value": $passed},
                    {"name": "❌ Falhou",            "value": $failed},
                    {"name": "⏭️ Pulado",           "value": $skipped},
                    {"name": "📊 Total",            "value": $total},
                    {"name": "🎯 Cobertura",        "value": $coverage},
                    {"name": "📈 Taxa de sucesso",  "value": $success_rate}
                  ],
                  "markdown": true
                }
              ],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "Abrir Allure Report",
                  "targets": [{"os": "default", "uri": $pages_url}]
                },
                {
                  "@type": "OpenUri",
                  "name": "Ver Build no GitHub",
                  "targets": [{"os": "default", "uri": $build_url}]
                }
              ]
            }' > payload.json

          curl -sS \
            -H "Content-Type: application/json" \
            --data @payload.json \
            "$TEAMS_WEBHOOK_URL"

      - name: Fail workflow if tests failed
        if: always()
        run: |
          TEST_EXIT_CODE=$(cat test_exit_code.txt 2>/dev/null || echo 1)
          exit "$TEST_EXIT_CODE"
